<!DOCTYPE html>
<html lang="nl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Inloggen - ClubMaster
    </title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >

</head>


<body>

<main class="auth-page">

    <section class="auth-card">

        <div class="auth-logo">
            ⚽
        </div>

        <h1>
            ClubMaster
        </h1>

        <p class="auth-subtitle">
            Log in om verder te gaan met je carrière.
        </p>


        {% if error %}

        <div class="auth-error">
            {{ error }}
        </div>

        {% endif %}


        <form
            method="POST"
            class="auth-form"
        >

            <label for="username">
                Gebruikersnaam
            </label>

            <input
                type="text"
                id="username"
                name="username"
                placeholder="Gebruikersnaam"
                required
                autocomplete="username"
            >


            <label for="password">
                Wachtwoord
            </label>

            <input
                type="password"
                id="password"
                name="password"
                placeholder="Wachtwoord"
                required
                autocomplete="current-password"
            >


            <button
                type="submit"
                class="club-button auth-button"
            >
                🔐 Inloggen
            </button>

        </form>


        <p class="auth-switch">
            Nog geen account?
            <a href="{{ url_for('register') }}">
                Account aanmaken
            </a>
        </p>

    </section>

</main>

</body>

</html>
